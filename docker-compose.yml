version: '3.9'

# Local development services for MilestoneX API.
# Usage:
#   docker compose up -d        # start all services in background
#   docker compose down         # stop and remove containers
#   docker compose logs -f api  # tail API logs

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: milestonex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: milestonex
      POSTGRES_PASSWORD: milestonex_dev_pass
      POSTGRES_DB: milestonex
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U milestonex']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: milestonex_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS API ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milestonex_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://milestonex:milestonex_dev_pass@postgres:5432/milestonex?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      # Hot-reload: mount source so nodemon/ts-node picks up changes
      - .:/app
      - /app/node_modules
    command: npm run start:dev

volumes:
  postgres_data:
  redis_data:
